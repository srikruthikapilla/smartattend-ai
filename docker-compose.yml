services:
  postgres:
    image: postgres:16-alpine
    container_name: smartattend-postgres
    restart: always
    environment:
      POSTGRES_DB: smartattend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/postgresql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartattend"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartattend-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgrespassword@postgres:5432/smartattend}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://[REDACTED_PROJECT_REF].supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-[REDACTED_SUPABASE_TOKEN]}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    container_name: smartattend-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

