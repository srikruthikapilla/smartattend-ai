services:
  postgres:
    image: postgres:16-alpine
    container_name: smartattend-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartattend}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/postgresql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartattend}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Not exposed to host — internal service only

  redis:
    image: redis:7-alpine
    container_name: smartattend-redis
    restart: always
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Not exposed to host — internal service only

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartattend-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-localdevpassword123}@postgres:5432/${POSTGRES_DB:-smartattend}
      REDIS_URL: redis://redis:6379/0
      # Security secrets — MUST be overridden in Coolify for production.
      # The backend app will raise a RuntimeError at startup if NODE_ENV=production
      # and these still hold their default values.
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-not-for-production}
      EDGE_API_KEY: ${EDGE_API_KEY:-local-dev-edge-key-not-for-production}
      # Bootstrap admin — used only if no admins exist in the DB
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sbit.ac.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123!}
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Brevo SMTP
      BREVO_SMTP_SERVER: ${BREVO_SMTP_SERVER:-smtp-relay.brevo.com}
      BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-587}
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN:-}
      BREVO_SMTP_KEY: ${BREVO_SMTP_KEY:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      BREVO_FROM_NAME: ${BREVO_FROM_NAME:-Smart Attend — SBIT}
    # Backend is NOT exposed to host — access is via Nginx reverse proxy only
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartattend-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
